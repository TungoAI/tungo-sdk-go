name: Release Go Module

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Vet & Test
        run: |
          go vet ./...
          go test ./... -v

      - name: Create GitHub Release & Warm Go Proxy
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" --generate-notes --title "${GITHUB_REF_NAME}" || true
          curl -fsSL "https://proxy.golang.org/github.com/TungoAI/tungo-sdk-go/@v/${GITHUB_REF_NAME}.info" || true
