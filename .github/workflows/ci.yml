          go mod tidy -diff
          if grep -qE '^require' go.mod; then
            echo "the module must stay dependency-free"
            exit 1
          fi
      - run: go vet ./...
      - run: go build ./...
      - name: staticcheck
        if: matrix.go == 'stable'
        run: go run honnef.co/go/tools/cmd/staticcheck@latest ./...
      - name: Tests (race detector, examples included)
        run: go test -race -count=1 ./...
